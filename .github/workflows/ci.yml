name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ficcado-website-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ficcado-website-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Brand Spelling Verification
        run: npm run check:brand

      - name: ESLint Code Quality
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Automated Unit & Concurrency Tests
        run: npm test

      - name: Production Build Verification
        env:
          NODE_ENV: production
          NEXT_PUBLIC_WHATSAPP_NUMBER: "919497144795"
          NEXT_PUBLIC_SITE_URL: "https://ficcado.store"
          NEXT_PUBLIC_PRIVACY_EMAIL: "ficcado.clothing@gmail.com"
          ORDER_ID_MODE: "sheet-row"
          RATE_LIMIT_STORE: "memory"
        run: npm run build
