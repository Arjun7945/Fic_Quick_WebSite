name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ficcado-website-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ficcado-website-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Build Manifests & Metadata
        run: npm run generate

      - name: Brand Spelling Verification
        run: npm run check:brand

      - name: ESLint Code Quality
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Automated Unit & Concurrency Tests
        run: npm test

      - name: Production Build Verification
        env:
          NODE_ENV: production
          NEXT_PUBLIC_WHATSAPP_NUMBER: "916282000729"
          NEXT_PUBLIC_SITE_URL: "https://ficcado.in"
          NEXT_PUBLIC_PRIVACY_EMAIL: "ficcado.clothing@gmail.com"
          ORDER_ID_MODE: "sheet-row"
          RATE_LIMIT_STORE: "memory"
        run: npm run build

      - name: Cross-Device & Viewport Responsiveness Checks
        env:
          NODE_ENV: production
          NEXT_PUBLIC_WHATSAPP_NUMBER: "916282000729"
          NEXT_PUBLIC_SITE_URL: "https://ficcado.in"
          NEXT_PUBLIC_PRIVACY_EMAIL: "ficcado.clothing@gmail.com"
          ORDER_ID_MODE: "sheet-row"
          RATE_LIMIT_STORE: "memory"
        run: npm run check:devices

  deploy:
    name: Deploy to Vercel (Production)
    needs: test
    # Production deployment is strictly reserved for 'main'. Feature branches (such as 'fic/website') run validation only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ficcado-website-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ficcado-website-frontend
        run: npm ci

      - name: Generate Build Manifests & Metadata
        working-directory: ficcado-website-frontend
        run: npm run generate

      - name: Verify Vercel Secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing required Vercel secrets: VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID."
            echo "Please configure these repository secrets in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Pull Vercel Environment Information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build Project Artifacts via Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NODE_ENV: production
          NEXT_PUBLIC_WHATSAPP_NUMBER: "916282000729"
          NEXT_PUBLIC_SITE_URL: "https://ficcado.in"
          NEXT_PUBLIC_PRIVACY_EMAIL: "ficcado.clothing@gmail.com"
          ORDER_ID_MODE: "sheet-row"
          RATE_LIMIT_STORE: "memory"
        run: npx vercel@latest build --prod --token=$VERCEL_TOKEN

      - name: Deploy Prebuilt Artifacts to Vercel
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOY_URL=$(npx vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "### Vercel Deployment Successful 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Production URL: $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
